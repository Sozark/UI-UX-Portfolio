name: Deploy work portfolio to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'work/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # Only work/ is uploaded, so work/CNAME lands at the site root and
      # claims work.noahcjones.dev. portfolio-final/ is not published.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: work

      - id: deployment
        uses: actions/deploy-pages@v4
